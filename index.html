<script>
"use strict";
const REPORTS_URL="./reports/index.json";
let reports=[],category="all",searchText="";
const root=document.getElementById("root"),topBtn=document.getElementById("topBtn");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={global:"全球新闻早报",semiconductor:"美股半导体晨报",premarket:"美股盘前预警"};
const safeUrl=x=>{try{const u=new URL(x);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}};
function inline(s){
 const links=[];
 let a=String(s).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,(_,label,url)=>{
   const u=safeUrl(url);
   if(!u)return label;
   const key="ZZLINKPLACEHOLDER"+links.length+"ZZ";
   links.push('<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>');
   return key;
 });
 a=esc(a);
 a=a.replace(/https?:\/\/[^\s<>]+/g,url=>{
   const u=safeUrl(url);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>':url;
 });
 a=a.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
 return a.replace(/ZZLINKPLACEHOLDER(\d+)ZZ/g,(_,n)=>links[Number(n)]||"");
}
function markdown(source){
 const lines=String(source||"").replace(/\r/g,"").split("\n");let out="",list=null,table=false,headers=[],headings=[];
 const close=()=>{if(list){out+="</"+list+">";list=null}if(table){out+="</tbody></table></div>";table=false}};
 const cells=s=>s.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();if(!line){close();continue}
  if(/^\|?\s*[:-]+[-| :]*\|?\s*$/.test(line)&&table)continue;
  if(line.startsWith("|")&&line.endsWith("|")){
   if(!table){close();table=true;headers=cells(line);out+='<div class="table-scroll"><table><thead><tr>'+headers.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";}
   else out+="<tr>"+cells(line).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
   continue;
  }
  const isList=/^(?:\\d+\\.\\s+|[-*]\\s+)/.test(line);
  if(!isList)close();
  if(/^---+$/.test(line)){out+="<hr>";continue}
  const h=line.match(/^(#{1,4})\s+(.+)$/);
  if(h){const level=Math.min(3,h[1].length);const id="sec-"+headings.length;headings.push({id,title:h[2].replace(/\*\*/g,""),level});out+="<h"+level+' id="'+id+'">'+inline(h[2])+"</h"+level+">";continue}
  const ol=line.match(/^(\d+)\.\s+(.+)$/),ul=line.match(/^[-*]\s+(.+)$/);
  if(ol||ul){const type=ol?"ol":"ul";if(list!==type){if(list)out+="</"+list+">";list=type;out+="<"+list+">"}out+="<li>"+inline(ol?ol[2]:ul[1])+"</li>";continue}
  if(line.startsWith(">")){out+="<blockquote><p>"+inline(line.replace(/^>\s?/,""))+"</p></blockquote>";continue}
  out+="<p>"+inline(line)+"</p>";
 }
 close();return {html:out,headings};
}
const formatDate=d=>{const a=String(d).split("-");return a.length===3?a[0]+"."+a[1]+"."+a[2]:d};
const cardVisual=k=>{
 if(k==="global")return '<svg viewBox="0 0 540 195" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="globeBG" x2="1" y2="1"><stop stop-color="#16405a"/><stop offset="1" stop-color="#2e938e"/></linearGradient></defs><rect width="540" height="195" fill="url(#globeBG)"/><circle cx="350" cy="100" r="123" fill="none" stroke="#d9eee6" stroke-opacity=".55" stroke-width="2"/><ellipse cx="350" cy="100" rx="64" ry="123" fill="none" stroke="#c4e9e5" stroke-opacity=".5"/><ellipse cx="350" cy="100" rx="123" ry="37" fill="none" stroke="#c4e9e5" stroke-opacity=".5"/><path d="M227 100h246M350 -23v246" stroke="#d2eae3" stroke-opacity=".38"/><path d="M42 154 Q153 41 306 122 T500 85" fill="none" stroke="#f8d69b" stroke-width="2.5"/><circle cx="188" cy="88" r="6" fill="#f8d69b"/><circle cx="417" cy="112" r="6" fill="#f8d69b"/><path d="M0 170 Q170 120 300 200" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="40"/></svg>';
 if(k==="semiconductor")return '<svg viewBox="0 0 540 195" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="chipBG" x2="1" y2="1"><stop stop-color="#232b55"/><stop offset="1" stop-color="#686aaf"/></linearGradient></defs><rect width="540" height="195" fill="url(#chipBG)"/><g stroke="#9bb0f1" stroke-opacity=".35" stroke-width="2" fill="none"><path d="M0 38h190l50 50h62M0 91h145l85 65h89M540 46H410l-54 42h-55M540 161H418l-54-39h-62"/></g><g transform="translate(298 16) rotate(-12 100 80)"><rect x="48" y="27" width="165" height="137" rx="17" fill="#c3c8f2" opacity=".24"/><rect x="57" y="35" width="147" height="120" rx="12" fill="#303f83" stroke="#d2d5ff" stroke-width="4"/><rect x="86" y="62" width="90" height="66" rx="7" fill="#819be2"/><path d="M94 95h72M130 70v50" stroke="#e4edff" stroke-width="3"/><g stroke="#d6e1ff" stroke-width="5"><path d="M78 35V18M111 35V18M145 35V18M179 35V18M78 155v18M111 155v18M145 155v18M179 155v18M57 58H38M57 92H38M57 126H38M204 58h19M204 92h19M204 126h19"/></g></g><path d="M42 149L99 120 150 138 196 82 249 94" fill="none" stroke="#80e1d5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 return '<svg viewBox="0 0 540 195" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="540" height="195" fill="#315371"/><g stroke="#99c3da" opacity=".28"><path d="M30 0v195M90 0v195M150 0v195M210 0v195M270 0v195M330 0v195M390 0v195M450 0v195M510 0v195M0 40h540M0 100h540M0 160h540"/></g><path d="M60 147L142 124 223 137 305 67 393 83 486 29" stroke="#a7e3d2" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M458 29h28v28" stroke="#a7e3d2" fill="none" stroke-width="7"/></svg>';
};
const cardIcon=k=>({global:"◎",semiconductor:"▦",premarket:"↗"}[k]||"◉");
function home(){
 const shown=reports.filter(r=>(category==="all"||r.category===category)&&[r.title,r.summary,r.content,r.date].join(" ").toLowerCase().includes(searchText.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
 const mostRecent=reports.map(x=>x.date).sort().reverse()[0]||"尚无数据";

 '<div class="stats"><div class="stat"><span class="stat-symbol">▤</span><div><strong>'+reports.length+'</strong><span>已收录报告</span></div></div><div class="stat"><span class="stat-symbol">◷</span><div><strong>'+new Set(reports.map(r=>r.date)).size+'</strong><span>归档日期</span></div></div><div class="stat"><span class="stat-symbol">↗</span><div><strong>'+reports.filter(r=>r.category!=="global").length+'</strong><span>市场晨报</span></div></div></div>'+
 '<section class="section"><div class="section-top"><div><div class="section-kicker">THE ARCHIVE</div><h2 class="section-heading">晨报档案</h2></div><span class="section-hint">最近更新 '+esc(mostRecent)+'</span></div>'+
 '<div class="toolbar"><div class="search-wrap"><input type="search" class="search" aria-label="搜索晨报" placeholder="搜索标题、公司、关键词…" value="'+esc(searchText)+'"></div><div class="filters">'+["all","global","semiconductor","premarket"].map(k=>'<button type="button" data-category="'+k+'" class="filter '+(category===k?"active":"")+'">'+(k==="all"?"全部":labels[k])+"</button>").join("")+'</div></div>'+
 (shown.length?'<div class="cards">'+shown.map(r=>'<button type="button" class="report-card" data-id="'+esc(r.id)+'"><div class="card-art '+esc(r.category)+'">'+cardVisual(r.category)+'<span class="art-caption">'+(r.category==="global"?"WORLD BRIEF":"MARKET INTELLIGENCE")+'</span></div><div class="card-body"><div class="card-meta"><span class="category '+esc(r.category)+'">'+esc(labels[r.category])+'</span><span>'+esc(formatDate(r.date))+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.summary||"阅读完整晨报及原始来源")+'</p><div class="card-bottom"><span>'+(r.archive_status==="excerpt"?"阅读已归档节选":"阅读全文")+'</span><span class="arrow">→</span></div></div></button>').join("")+'</div>':'<div class="empty"><b>'+(reports.length?"未找到符合条件的晨报":"晨报档案即将开始")+'</b>'+(reports.length?"换个搜索词试试。":"发布晨报后会自动出现在这里。")+'</div>')+"</section>";

function enrichArticle(html){
 return html.replace(/<p>((?:<strong>)?(?:【已核实事实】|【分析(?:／推断)?】|【当事方说法】|【公司说法】|【机构风险评估】))/g,(all,label)=>'<p class="'+(label.includes("事实")?"fact":label.includes("分析")?"analysis":"statement")+'">'+label);
}
function article(id){
 const r=reports.find(x=>x.id===id);if(!r){location.hash="#/";return}
 const parsed=markdown(r.content);
 root.innerHTML='<div class="article-view"><button type="button" class="back" id="back">← 返回晨报档案</button><header class="article-head '+(r.category==="semiconductor"?"semi":r.category==="premarket"?"pre":"")+'"><div class="article-meta">'+esc(labels[r.category])+'　 / 　'+esc(formatDate(r.date))+'</div><h1>'+esc(r.title)+'</h1><p>'+esc(r.summary||"每日新闻与市场动态研究")+'</p></header><div class="article-layout"><article class="reading-paper">'+parsed.html+'<div class="article-note '+(r.archive_status==="excerpt"?"warning":"")+'">'+(r.archive_status==="excerpt"?"本篇来自自动任务记录的可获取部分，原始输出已被截断，因此不是全文。":"以上内容归档自当天的定时任务记录。")+' 新闻内容与行情可能随时间发生变化，请查看原文链接核对。</div></article><aside class="toc"><h3>CONTENTS / 本文目录</h3>'+parsed.headings.filter(h=>h.level<=2).map(h=>'<a href="#'+h.id+'" data-anchor="'+h.id+'">'+esc(h.title)+'</a>').join("")+'</aside></div></div>';
 document.getElementById("back").addEventListener("click",()=>location.hash="#/");
 root.querySelectorAll("[data-anchor]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:"smooth"})}));
}
function route(){
 const m=location.hash.match(/^#\/report\/(.+)$/);if(m){try{article(decodeURIComponent(m[1]))}catch(e){home()}}else home();
 window.scrollTo({top:0,behavior:"instant"});updateTop();
}
function updateTop(){topBtn.classList.toggle("visible",window.scrollY>300)}
topBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll",updateTop,{passive:true});window.addEventListener("hashchange",route);
async function load(){try{const response=await fetch(REPORTS_URL+"?v="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();reports=(Array.isArray(data)?data:data.reports||[]).filter(x=>x&&typeof x.id==="string"&&typeof x.title==="string"&&typeof x.date==="string"&&typeof x.content==="string"&&labels[x.category]);document.getElementById("status").textContent="● 今日档案已同步"}catch(err){console.warn(err);document.getElementById("status").textContent="档案暂不可用";reports=[]}route()}
load();
