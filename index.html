<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b394d"><meta name="description" content="Morning Archive · 每日全球新闻、半导体晨报档案">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/morning-archive.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/morning-archive.svg">
<title>Morning Archive · 晨报档案</title><style>
:root{--ink:#1c3243;--muted:#788893;--line:#e4eaea;--green:#287c81}*{box-sizing:border-box}body{margin:0;background:#f8f9f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}a{text-decoration:none;color:inherit}.wrap{max-width:1130px;margin:auto;padding:0 24px}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px;font-family:Georgia,serif;font-size:23px;font-weight:700}.brand img{width:46px;height:46px}.status{color:var(--green);font-size:12px;background:#eaf4f3;border-radius:30px;padding:8px 13px}.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(125deg,#173747,#2f6d76);color:white;border-radius:24px;padding:48px 50px;margin-top:26px}.hero .eyebrow{font-size:11px;letter-spacing:2px;color:#b6dfda}.hero h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:clamp(30px,5vw,49px);line-height:1.35;margin:16px 0}.hero p{color:#d2e6e4;line-height:1.9;font-size:14px;max-width:530px}.hero svg{position:absolute;right:10px;top:-22px;width:40%;height:110%;z-index:-1;opacity:.64}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:23px 0 39px}.stat{padding:22px 23px;background:#fff;border:1px solid var(--line);border-radius:17px}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.label{font-size:11px;letter-spacing:2px;font-weight:700;color:#288083}.heading{font-size:26px;margin:10px 0 22px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:20px}.search{flex:1;min-width:240px;border:1px solid var(--line);padding:13px 15px;border-radius:12px;background:#fff;outline:none;color:var(--ink)}.search:focus{border-color:#7db8ad}.filter{border:1px solid var(--line);padding:12px 14px;background:#fff;border-radius:10px;color:#60747c;font-size:12px;cursor:pointer}.filter.active{background:#213f52;color:#fff;border-color:#213f52}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:block;overflow:hidden;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 12px 30px #23435309;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 34px #24465b17}.card-art{height:148px;position:relative;overflow:hidden;background:linear-gradient(120deg,#194659,#35918f)}.card-art.semi{background:linear-gradient(120deg,#30325e,#7772af)}.card-art svg{width:100%;height:100%;position:absolute;inset:0}.card-type{position:absolute;left:24px;bottom:18px;color:white;font-size:12px;letter-spacing:1.8px;font-weight:650}.card-info{padding:25px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.badge{font-size:11px;border-radius:6px;color:#2a817c;background:#e8f4f1;padding:7px 10px}.badge.semi{background:#eeebf8;color:#6b62a3}.card h3{font-size:21px;line-height:1.5;margin:20px 0 11px}.card p{font-size:13px;color:#73818e;line-height:1.8;min-height:48px}.card-foot{display:flex;justify-content:space-between;margin-top:23px;padding-top:16px;border-top:1px solid #eef0f1;color:#287d82;font-size:13px;font-weight:650}.empty{border:1px dashed #bdcece;background:#fff;padding:65px 20px;border-radius:17px;text-align:center;color:#7b8a94}.foot{border-top:1px solid var(--line);padding:30px 0;margin-top:60px;font-size:12px;color:#9aa7ae}.top-btn{position:fixed;right:22px;bottom:24px;width:48px;height:48px;background:#255668;color:white;border:0;border-radius:15px;opacity:0;pointer-events:none;box-shadow:0 8px 25px #213f5235;cursor:pointer;font-size:23px;transition:opacity .2s}.top-btn.visible{opacity:1;pointer-events:auto}@media(max-width:750px){.cards{grid-template-columns:1fr}.hero svg{right:-80px;width:63%;opacity:.35}.hero{padding:35px 26px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:21px}.wrap{padding:0 16px}}@media(max-width:500px){.nav{height:70px}.brand{font-size:19px}.brand img{width:38px;height:38px}.hero h1{font-size:32px}.hero p{font-size:12px}.card-info{padding:20px}.card h3{font-size:19px}.card-art{height:125px}.toolbar{gap:6px}.filter{font-size:11px;padding:10px 11px}}
</style></head><body>
<div class="wrap"><nav class="nav"><a class="brand" href="./"><img src="./icons/morning-archive.svg" alt="">Morning Archive</a><span class="status" id="status">正在加载目录</span></nav>
<section class="hero"><div class="eyebrow">YOUR DAILY INTELLIGENCE JOURNAL</div><h1>为每一天的重要资讯，<br>留一页好看的记录。</h1><p>全球新闻、半导体晨报与市场动态，独立成篇，按日期归档。<br>阅读更舒服，回顾更轻松。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 280" aria-hidden="true"><circle cx="221" cy="108" r="92" fill="#f7c997"/><circle cx="224" cy="170" r="104" fill="#399a9c"/><ellipse cx="224" cy="170" rx="55" ry="104" stroke="#b4dfe1" stroke-width="2" fill="none"/><ellipse cx="224" cy="170" rx="104" ry="35" stroke="#b4dfe1" stroke-width="2" fill="none"/><path d="M120 170h208M224 66v208" stroke="#b4dfe1" opacity=".5" stroke-width="2"/></svg></section>
<div class="stats"><div class="stat"><strong id="total">—</strong><span>归档报告</span></div><div class="stat"><strong id="days">—</strong><span>记录天数</span></div><div class="stat"><strong id="markets">—</strong><span>市场晨报</span></div></div>
<section><div class="label">READ · RESEARCH · REMEMBER</div><h2 class="heading">晨报档案</h2><div class="toolbar"><input id="search" class="search" placeholder="搜索日期、标题或关键词…" aria-label="搜索晨报"><button class="filter active" data-cat="all">全部</button><button class="filter" data-cat="global">全球新闻</button><button class="filter" data-cat="semiconductor">半导体</button><button class="filter" data-cat="premarket">盘前预警</button></div><div class="cards" id="cards"><div class="empty">正在读取晨报目录…</div></div></section>
<footer class="foot">© Morning Archive · Asia / Singapore · v1.0</footer></div>
<button id="top" class="top-btn" aria-label="返回顶部" title="返回顶部">↑</button>
<script>
"use strict";
const LABELS={global:"全球新闻早报",semiconductor:"美股半导体晨报",premarket:"美股盘前预警"};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cardSVG=k=>k==="global"?'<svg viewBox="0 0 460 148" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="310" cy="76" r="93" fill="none" stroke="#c4eeeb" stroke-width="2"/><ellipse cx="310" cy="76" rx="48" ry="93" fill="none" stroke="#c4eeeb" stroke-width="2"/><ellipse cx="310" cy="76" rx="93" ry="32" fill="none" stroke="#c4eeeb" stroke-width="2"/><path d="M217 76h186" stroke="#c4eeeb"/><path d="M45 100L120 62 168 75 240 36" stroke="#f6ca91" stroke-width="3" fill="none"/></svg>':'<svg viewBox="0 0 460 148" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="265" y="12" width="126" height="120" rx="16" fill="#343a77" stroke="#d2d8ff" stroke-width="4"/><rect x="288" y="37" width="80" height="70" rx="9" fill="#9cafe8"/><path d="M303 84l20-20 16 12 16-30" stroke="#e4f8ff" stroke-width="4" fill="none"/><path d="M296 12V0M329 12V0M360 12V0M296 132v16M329 132v16M360 132v16M265 40h-24M265 78h-24M391 40h20M391 78h20" stroke="#d3d8fa" stroke-width="5"/><path d="M36 109L95 73 153 89 212 29" stroke="#9ae9df" stroke-width="5" fill="none"/></svg>';
let reports=[],category="all",term="";
const cards=document.getElementById("cards");
function paint(){
 const rows=reports.filter(r=>(category==="all"||r.category===category)&&[r.title,r.summary,r.date].join(" ").toLowerCase().includes(term.toLowerCase()));
 cards.innerHTML=rows.length?rows.map(r=>{
 const semi=r.category!=="global";
 return '<a class="card" href="'+esc(r.url)+'"><div class="card-art '+(semi?"semi":"")+'">'+cardSVG(r.category)+'<span class="card-type">'+(semi?"SEMICONDUCTOR REPORT":"WORLD NEWS BRIEF")+'</span></div><div class="card-info"><div class="card-head"><span class="badge '+(semi?"semi":"")+'">'+esc(LABELS[r.category]||"晨报")+'</span><span>'+esc(r.date)+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.summary||"查看当日完整内容")+'</p><div class="card-foot"><span>'+(r.archive_status==="excerpt"?"阅读归档节选":"阅读独立文章")+'</span><span>→</span></div></div></a>'
 }).join(""):'<div class="empty">暂无符合条件的晨报。</div>';
}
document.getElementById("search").oninput=e=>{term=e.target.value;paint()};
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));paint()});
const topButton=document.getElementById("top");addEventListener("scroll",()=>topButton.classList.toggle("visible",scrollY>300),{passive:true});topButton.onclick=()=>scrollTo({top:0,behavior:"smooth"});
fetch("./reports/catalog.json?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
 reports=(data.reports||[]).filter(r=>r&&typeof r.url==="string"&&/^reports\/\d{4}\/\d{2}\/[a-z0-9-]+\.html$/.test(r.url)).sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("total").textContent=reports.length;document.getElementById("days").textContent=new Set(reports.map(r=>r.date)).size;document.getElementById("markets").textContent=reports.filter(r=>r.category!=="global").length;
 document.getElementById("status").textContent="● 档案已同步";paint()
}).catch(err=>{console.error(err);cards.innerHTML='<div class="empty">暂时无法读取档案目录，请刷新页面重试。</div>';document.getElementById("status").textContent="加载失败"});
</script></body></html>
